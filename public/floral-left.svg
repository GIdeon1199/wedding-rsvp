  <ellipse cx="135" cy="260" rx="16" ry="30" fill="#1B3A6B" opacity="0.6" transform="rotate(30 135 260)"/>
  <ellipse cx="130" cy="305" rx="15" ry="28" fill="#1B3A6B" opacity="0.6" transform="rotate(70 130 305)"/>
