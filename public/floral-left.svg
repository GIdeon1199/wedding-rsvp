  <ellipse cx="318" cy="465" rx="11" ry="21" fill="#1B3A6B" opacity="0.55" transform="rotate(155 318 465)"/>
  <ellipse cx="316" cy="435" rx="12" ry="22" fill="#1B3A6B" opacity="0.55" transform="rotate(-40 316 435)"/>
  <circle cx="340" cy="450" r="11" fill="#2a4d8a" opacity="0.8"/>

  <!-- Gold leaf stem 1 -->
  <path d="M60 400 Q90 350 130 320 Q160 290 180 240" stroke="#B8860B" stroke-width="1.5" fill="none" opacity="0.7"/>
  <ellipse cx="95" cy="355" rx="8" ry="18" fill="#B8860B" opacity="0.55" transform="rotate(-40 95 355)"/>
  <ellipse cx="120" cy="325" rx="8" ry="16" fill="#B8860B" opacity="0.5" transform="rotate(-25 120 325)"/>
  <ellipse cx="155" cy="270" rx="7" ry="14" fill="#B8860B" opacity="0.45" transform="rotate(-10 155 270)"/>
  <ellipse cx="175" cy="245" rx="6" ry="12" fill="#B8860B" opacity="0.4" transform="rotate(10 175 245)"/>

  <!-- Gold leaf stem 2 -->
  <path d="M200 500 Q230 460 260 420 Q290 380 310 340" stroke="#B8860B" stroke-width="1.5" fill="none" opacity="0.65"/>
  <ellipse cx="235" cy="455" rx="7" ry="15" fill="#B8860B" opacity="0.5" transform="rotate(-35 235 455)"/>
  <ellipse cx="270" cy="412" rx="7" ry="14" fill="#B8860B" opacity="0.45" transform="rotate(-20 270 412)"/>
  <ellipse cx="300" cy="352" rx="6" ry="13" fill="#B8860B" opacity="0.4" transform="rotate(5 300 352)"/>

