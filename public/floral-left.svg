  <ellipse cx="300" cy="128" rx="9" ry="17" fill="#1B3A6B" opacity="0.55" transform="rotate(110 300 128)"/>
  <ellipse cx="278" cy="115" rx="9" ry="17" fill="#1B3A6B" opacity="0.5" transform="rotate(150 278 115)"/>
