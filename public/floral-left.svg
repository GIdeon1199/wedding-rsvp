  <ellipse cx="285" cy="112" rx="7" ry="13" fill="#B8860B" opacity="0.45" transform="rotate(25 285 112)"/>
  <ellipse cx="228" cy="165" rx="6" ry="12" fill="#B8860B" opacity="0.4" transform="rotate(10 228 165)"/>

  <!-- Small scattered buds -->
  <circle cx="50" cy="150" r="5" fill="#1B3A6B" opacity="0.4"/>
  <circle cx="370" cy="220" r="4" fill="#1B3A6B" opacity="0.35"/>
  <circle cx="200" cy="80" r="5" fill="#1B3A6B" opacity="0.35"/>
  <circle cx="380" cy="350" r="4" fill="#1B3A6B" opacity="0.3"/>
  <circle cx="30"  cy="480" r="6" fill="#1B3A6B" opacity="0.4"/>

  <!-- Thin trailing vines -->
  <path d="M20 200 Q80 180 120 200 Q160 220 200 190" stroke="#1B3A6B" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M150 520 Q200 490 240 510 Q280 530 320 500" stroke="#1B3A6B" stroke-width="0.8" fill="none" opacity="0.3"/>
  <path d="M250 30 Q290 60 320 40" stroke="#B8860B" stroke-width="0.8" fill="none" opacity="0.35"/>
